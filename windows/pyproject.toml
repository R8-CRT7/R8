[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart360"
version = "0.5.0a1"
description = "360 SMART - AI Driving Theory Assistant (Windows desktop companion)"
requires-python = ">=3.11"
license = { text = "Proprietary (personal use)" }
dependencies = [
    "PySide6>=6.8,<7",
    "pydantic>=2.7,<3",
    "numpy>=1.26",
    "Pillow>=10.3",
    "mss>=9.0",
    "rapidfuzz>=3.6",
    "anthropic>=1,<2",
    "keyring>=25",
    "psutil>=5.9",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.0"]
tesseract = []  # tesseract binary only (called directly, see vision/ocr.py)
windows = [
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
smart360 = "smart360.app:main"

[tool.setuptools.packages.find]
include = ["smart360*"]

[tool.setuptools.package-data]
smart360 = ["assets/fonts/*", "assets/sounds/*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PL"]
ignore = [
    "PLR0913", "PLR0912", "PLR0915", "PLR2004", "PLR0911", "S101", "S311",
    "RUF001", "RUF002", "RUF003", "PLW0603", "PLC0415", "S608",
    "SIM105", "PLR0917", "S110",  # best-effort cleanup blocks; DI constructors
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PL", "B", "RUF012"]
"tools/*" = ["S", "PL", "T201", "E501"]
"smart360/ui/*" = ["E501", "RUF012"]  # QSS strings / UI copy; constant lookup tables

[tool.mypy]
python_version = "3.12"  # runtime shipped in the installer; numpy>=2.5 stubs need 3.12 syntax
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true
exclude = ["build/", "dist/"]

[[tool.mypy.overrides]]
module = ["smart360.platform.win32"]
disable_error_code = ["attr-defined", "name-defined"]

[[tool.mypy.overrides]]
module = ["smart360.ui.*"]
disable_error_code = ["attr-defined", "union-attr", "arg-type", "call-overload", "assignment", "override"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = [
    "soak: long running soak / memory test (select with -m soak)",
    "windows: requires a real Windows desktop",
    "ocr: requires the tesseract binary",
]
addopts = "-m 'not soak and not windows'"

[tool.bandit]
exclude_dirs = ["tests", "tools"]
# B101 asserts are used for internal invariants only (never for security checks);
# B311 random is only used for retry jitter and deterministic test data.
skips = ["B101", "B311"]
