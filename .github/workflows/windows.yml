name: windows

on:
  push:
    branches: ["main", "claude/**"]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests (Linux + real OCR)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/pyproject.toml
      - name: System packages (Qt runtime libs, tesseract)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 tesseract-ocr tesseract-ocr-deu
      - run: pip install -e ".[dev,openai,gemini]"
      - run: ruff check smart360 tests tools
      - run: mypy smart360
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: Security scan (bandit)
        run: bandit -q -r smart360 -c pyproject.toml -ll
      - name: Dependency audit
        run: pip-audit --progress-spinner off || true

  windows:
    name: Native Windows tests + installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/pyproject.toml
      - run: pip install -e ".[dev,windows]" "pyinstaller>=6.10"
      - name: Unit + integration tests (Windows)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: Native Windows tests (real window, capture, OCR, SendInput, hotkeys, Credential Manager)
        env:
          QT_QPA_PLATFORM: windows
        run: pytest -q -s -m windows tests/test_windows_native.py
      - name: Build 360Smart.exe (PyInstaller)
        run: pyinstaller packaging/smart360.spec --noconfirm --clean --distpath dist --workpath build
      - name: Self-test frozen app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\360Smart\360Smart.exe -ArgumentList "--self-test","--demo","--data-dir","$env:RUNNER_TEMP\st" -Wait -PassThru
          "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss
      - name: Silent install + run installed app self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\360SmartSetup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/DIR=$env:RUNNER_TEMP\app" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          $q = Start-Process -FilePath "$env:RUNNER_TEMP\app\360Smart.exe" -ArgumentList "--self-test","--demo","--data-dir","$env:RUNNER_TEMP\st2" -Wait -PassThru
          "installed app self-test exit: $($q.ExitCode)"
          if ($q.ExitCode -ne 0) { exit 1 }
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: 360SmartSetup
          path: windows/dist/360SmartSetup.exe
          if-no-files-found: error
