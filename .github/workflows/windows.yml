name: windows (tests, native, installer)

on:
  push:
    branches: ["main", "claude/**", "feature/**"]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Also publish 360SmartSetup.exe as a GitHub pre-release with this tag (e.g. v0.5.0-alpha.2); empty = no release"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests (Linux + real OCR)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/pyproject.toml
      - name: System packages (Qt runtime libs, tesseract)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 tesseract-ocr tesseract-ocr-deu
      - run: pip install -e ".[dev,openai,gemini]"
      - run: ruff check smart360 tests tools
      - run: mypy smart360
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: Security scan (bandit)
        run: bandit -q -r smart360 -c pyproject.toml -ll
      - name: Dependency audit
        run: pip-audit --progress-spinner off --skip-editable

  windows:
    name: Native Windows tests + installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/pyproject.toml
      - run: pip install -e ".[dev,windows,openai,gemini]" "pyinstaller>=6.10"
      - name: Unit + integration tests (Windows)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: Native Windows tests (real window, capture, OCR, SendInput, hotkeys, Credential Manager)
        env:
          QT_QPA_PLATFORM: windows
        run: pytest -q -s -m windows tests/test_windows_native.py | Tee-Object -FilePath dist-native.log
      - name: OCR benchmark (Windows OCR vs. simulator ground truth)
        run: python tools/ocr_benchmark.py --out dist/ocr_benchmark_windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: ocr-benchmark-windows
          path: windows/dist/ocr_benchmark_windows.json
      - name: Stamp build id (commit + run) into the app
        shell: pwsh
        run: Set-Content -Path smart360\_build.py -Value "BUILD = 'git ${{ github.sha }} / CI run ${{ github.run_number }}'"
      - name: Build 360Smart.exe (PyInstaller)
        run: pyinstaller packaging/smart360.spec --noconfirm --clean --distpath dist --workpath build
      - name: Self-test frozen app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\360Smart\360Smart.exe -ArgumentList "--self-test","--demo","--data-dir","$env:RUNNER_TEMP\st" -Wait -PassThru
          "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss
      - name: Silent install + run installed app self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\360SmartSetup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/DIR=$env:RUNNER_TEMP\app" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          $q = Start-Process -FilePath "$env:RUNNER_TEMP\app\360Smart.exe" -ArgumentList "--self-test","--demo","--data-dir","$env:RUNNER_TEMP\st2" -Wait -PassThru
          "installed app self-test exit: $($q.ExitCode)"
          if ($q.ExitCode -ne 0) { exit 1 }
          # "Create diagnosis" from the installed app (the Start-menu shortcut runs exactly this)
          $d = Start-Process -FilePath "$env:RUNNER_TEMP\app\360Smart.exe" -ArgumentList "--diagnose","--quiet","--demo","--data-dir","$env:RUNNER_TEMP\st3","--out","$env:RUNNER_TEMP\diag" -Wait -PassThru
          if ($d.ExitCode -ne 0) { throw "--diagnose exit $($d.ExitCode)" }
          $zip = Get-ChildItem "$env:RUNNER_TEMP\diag" -Filter "360SMART-Diagnose-*.zip" | Select-Object -First 1
          if (-not $zip) { throw "diagnosis ZIP not created" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $names = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName).Entries.FullName
          foreach ($n in "README.txt","report.json","self_test.txt") { if ($names -notcontains $n) { throw "$n missing in diagnosis ZIP" } }
          "diagnosis ZIP ok: $($zip.Name) ($($zip.Length) bytes): $($names -join ', ')"
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "*Diagnose*.lnk" | Select-Object -First 1
          if (-not $lnk) { throw "Start-menu shortcut 'Diagnose erstellen' missing" }
          "start menu shortcut: $($lnk.FullName)"
          Get-ChildItem dist | Format-Table Name, Length
          $h = (Get-FileHash dist\360SmartSetup.exe -Algorithm SHA256).Hash
          "360SmartSetup.exe SHA256: $h"
          Set-Content -Path dist\360SmartSetup.exe.sha256 -Value "$h  360SmartSetup.exe"
      - name: Silent uninstall + verify removal
        shell: pwsh
        run: |
          $u = Get-ChildItem "$env:RUNNER_TEMP\app" -Filter "unins*.exe" | Select-Object -First 1
          if (-not $u) { throw "uninstaller not found" }
          $p = Start-Process -FilePath $u.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          "uninstaller exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "uninstaller exit $($p.ExitCode)" }
          # the uninstaller deletes itself via a helper process - give it a moment
          for ($i = 0; $i -lt 30 -and (Test-Path "$env:RUNNER_TEMP\app\360Smart.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$env:RUNNER_TEMP\app\360Smart.exe") { throw "360Smart.exe still present after uninstall" }
          $reg = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall -ErrorAction SilentlyContinue |
            Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like "360 SMART*" }
          if ($reg) { throw "uninstall registry entry still present" }
          "uninstall verified: files and registry entry removed"
      - uses: actions/upload-artifact@v4
        with:
          name: 360SmartSetup
          path: |
            windows/dist/360SmartSetup.exe
            windows/dist/360SmartSetup.exe.sha256
          if-no-files-found: error
      - name: Job summary (native test output, OCR benchmark, installer)
        if: always()
        shell: pwsh
        run: |
          $out = @("## Native Windows tests", '```')
          if (Test-Path dist-native.log) { $out += Get-Content dist-native.log | Select-String -Pattern "OCR|execution|passed|failed|ms" | ForEach-Object { $_.Line } }
          $out += '```', "## Windows OCR benchmark", '```json'
          if (Test-Path dist\ocr_benchmark_windows.json) { $out += Get-Content dist\ocr_benchmark_windows.json }
          $out += '```', "## Installer", '```'
          if (Test-Path dist\360SmartSetup.exe) { $out += "size: $((Get-Item dist\360SmartSetup.exe).Length) bytes"; $out += Get-Content dist\360SmartSetup.exe.sha256 }
          $out += '```'
          $out | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

  release:
    name: Publish pre-release (manual)
    needs: windows
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 360SmartSetup
          path: out
      - name: Create GitHub pre-release with the installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$TAG" out/360SmartSetup.exe out/360SmartSetup.exe.sha256 \
            --prerelease --target "$GITHUB_SHA" --title "360 SMART $TAG" \
            --notes-file docs/RELEASE_NOTES.md
