name: ios (swift tests, xcode build)

on:
  push:
    branches: ["main", "claude/**", "feature/**"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Core tests + app build (simulator, unsigned)
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Swift package tests (Smart360Core)
        working-directory: ios/Packages/Smart360Core
        run: swift test
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build app + extensions for the iOS Simulator (no signing)
        run: |
          xcodebuild build -project Smart360.xcodeproj -scheme Smart360 \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Static analysis (clang/Swift analyzer, app + extensions)
        run: |
          xcodebuild analyze -project Smart360.xcodeproj -scheme Smart360 \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee analyze.log
          grep -E "warning: .*\[(clang-analyzer|core|deadcode|security|unix|osx)" analyze.log && exit 1 || echo "no analyzer findings"
      - name: Build for a real device (arm64, unsigned - proves the device slice compiles)
        run: |
          xcodebuild build -project Smart360.xcodeproj -scheme Smart360 \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Free-account project variant generates and builds
        run: |
          xcodegen generate --spec project-free.yml
          xcodebuild build -project Smart360.xcodeproj -scheme Smart360 \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: SwiftLint (informational)
        run: brew install swiftlint && swiftlint lint --quiet || true
