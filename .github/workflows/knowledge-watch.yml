name: knowledge watch (official law sources)

# Daily: download the in-force law texts from the Rechtsinformationsportal des Bundes (RIS API), compare them
# with the reviewed raw sources + snapshots in knowledge/sources and report changes and the affected knowledge.
# NEVER changes knowledge automatically. Raw sources are refreshed only by an explicit push whose message
# contains [refresh-sources] (a deliberate, reviewed step).

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      fetch_gii:
        description: "Also download FeV / StVG / BKatV xml.zip from gesetze-im-internet.de (official BMJ downloads) and commit the unmodified files to knowledge/sources/manual/"
        type: boolean
        default: false
  push:
    branches: ["feature/**", "claude/**"]
    paths: ["windows/tools/knowledge_watch.py", "knowledge/watch/**", ".github/workflows/knowledge-watch.yml"]

permissions:
  contents: write

jobs:
  watch:
    name: daily-theory-knowledge-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Official downloads from gesetze-im-internet.de (FeV, StVG, BKatV) - only on manual request
        if: github.event_name == 'workflow_dispatch' && inputs.fetch_gii
        continue-on-error: true
        run: |
          mkdir -p knowledge/sources/manual
          {
            echo "## gesetze-im-internet.de (official XML downloads)"
            for slug in fev_2010 stvg bkatv_2013; do
              code=$(curl -sS -L -o "knowledge/sources/manual/${slug}_xml.zip" -w '%{http_code}' --max-time 60 \
                     "https://www.gesetze-im-internet.de/${slug}/xml.zip" || echo "000")
              if [ "$code" = "200" ] && unzip -tq "knowledge/sources/manual/${slug}_xml.zip" >/dev/null 2>&1; then
                echo "- ${slug}: HTTP ${code}, sha256 $(sha256sum knowledge/sources/manual/${slug}_xml.zip | cut -c1-16)…"
              else
                echo "- ${slug}: not available (HTTP ${code})"
                rm -f "knowledge/sources/manual/${slug}_xml.zip"
              fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          git config user.name "knowledge-watch[bot]"
          git config user.email "knowledge-watch@users.noreply.github.com"
          git add knowledge/sources/manual/*_xml.zip 2>/dev/null || true
          git diff --cached --quiet && echo "nothing downloaded" && exit 0
          git commit -m "sources: official FeV/StVG/BKatV XML downloads from gesetze-im-internet.de, unmodified [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
      - name: Fetch official sources (RIS API)
        timeout-minutes: 15
        run: python windows/tools/knowledge_watch.py fetch-raw --out "$RUNNER_TEMP/raw"
      - name: Compare raw sources with the reviewed ones
        run: |
          {
            echo "# Knowledge watch - $(date -u +%F)"
            if [ -d knowledge/sources/raw ]; then
              diff -rq knowledge/sources/raw "$RUNNER_TEMP/raw" | grep -v meta.json && echo "**Status: CHANGE DETECTED - review needed**" || echo "**Status: NO_CHANGE**"
            else
              echo "**Status: no reviewed sources yet (bootstrap)**"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Impact analysis (parsed snapshots)
        if: hashFiles('knowledge/sources/snapshots/*.json') != ''
        continue-on-error: true
        run: |
          python windows/tools/knowledge_watch.py parse --raw "$RUNNER_TEMP/raw" --out "$RUNNER_TEMP/snap"
          python windows/tools/knowledge_watch.py compare --new "$RUNNER_TEMP/snap" --report "$RUNNER_TEMP/report.md" --json "$RUNNER_TEMP/report.json"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh raw sources (only on an explicit [refresh-sources] push)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[refresh-sources]')
        run: |
          rm -rf knowledge/sources/raw && mkdir -p knowledge/sources && cp -r "$RUNNER_TEMP/raw" knowledge/sources/raw
          git config user.name "knowledge-watch[bot]"
          git config user.email "knowledge-watch@users.noreply.github.com"
          git add knowledge/sources/raw
          git diff --cached --quiet && echo "sources unchanged" && exit 0
          git commit -m "sources: official law texts from the RIS API ($(date -u +%Y-%m-%d)) [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
