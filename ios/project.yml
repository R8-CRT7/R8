# XcodeGen spec - generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: Smart360
options:
  bundleIdPrefix: com.smart360
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""          # <- set your Apple Developer Team ID (or pick it in Xcode > Signing)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  Smart360Core:
    path: Packages/Smart360Core

targets:
  Smart360:
    type: application
    platform: iOS
    sources:
      - path: Smart360
    dependencies:
      - package: Smart360Core
      - target: Smart360Broadcast
      - target: Smart360Share
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smart360.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Smart360/Resources/Info.plist
      properties:
        CFBundleDisplayName: 360 SMART
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: 360 SMART reads the driving-theory question from the screenshot you pick.
        KeychainAccessGroup: $(AppIdentifierPrefix)com.smart360.shared
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Smart360/Resources/Smart360.entitlements
      properties:
        com.apple.security.application-groups: [group.com.smart360.app]
        keychain-access-groups: [$(AppIdentifierPrefix)com.smart360.shared]

  Smart360Broadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Smart360Broadcast
    dependencies:
      - package: Smart360Core
      - sdk: ReplayKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smart360.app.broadcast
    info:
      path: Smart360Broadcast/Info.plist
      properties:
        CFBundleDisplayName: 360 SMART
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KeychainAccessGroup: $(AppIdentifierPrefix)com.smart360.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: Smart360Broadcast/Smart360Broadcast.entitlements
      properties:
        com.apple.security.application-groups: [group.com.smart360.app]
        keychain-access-groups: [$(AppIdentifierPrefix)com.smart360.shared]

  Smart360Share:
    type: app-extension
    platform: iOS
    sources:
      - path: Smart360Share
    dependencies:
      - package: Smart360Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smart360.app.share
    info:
      path: Smart360Share/Info.plist
      properties:
        CFBundleDisplayName: 360 SMART
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KeychainAccessGroup: $(AppIdentifierPrefix)com.smart360.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: Smart360Share/Smart360Share.entitlements
      properties:
        com.apple.security.application-groups: [group.com.smart360.app]
        keychain-access-groups: [$(AppIdentifierPrefix)com.smart360.shared]

schemes:
  Smart360:
    build:
      targets:
        Smart360: all
    run:
      config: Debug
    archive:
      config: Release
