# FREE Apple account variant (Personal Team): app only, no extensions, no entitlements.
# App Groups and Keychain Sharing are not available to free accounts, so the Live (broadcast)
# and Share extensions are left out. Screenshot import + the Shortcuts/App Intent work.
#   xcodegen generate --spec project-free.yml
name: Smart360
options:
  bundleIdPrefix: com.smart360
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""          # <- your Personal Team (Xcode > Signing & Capabilities)
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  Smart360Core:
    path: Packages/Smart360Core
targets:
  Smart360:
    type: application
    platform: iOS
    sources:
      - path: Smart360
        excludes:                      # files generated/used only by the paid project.yml
          - Resources/Info.plist
          - "Resources/*.entitlements"
    dependencies:
      - package: Smart360Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smart360.app.$(DEVELOPMENT_TEAM)   # must be unique for free teams
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Smart360/Resources/Info-Free.plist
      properties:
        CFBundleDisplayName: 360 SMART
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: 360 SMART reads the driving-theory question from the screenshot you pick.
        ITSAppUsesNonExemptEncryption: false
